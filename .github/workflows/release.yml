# Tag, push, release. The tag is the only input: v1.2.3-beta1 builds 1.2.3-beta1.
#
#   git tag -a v1.2.3-beta1 -m "what this release is"
#   git push origin v1.2.3-beta1
#
# Nothing is deployed. A release here is the zip and its checksum attached to a tag, which is what
# a user installs by hand. Run it from the Actions tab for a dry run: the version Directory.Build.props
# declares is built, tested and packaged, and nothing is released.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # Only this job writes, and only to create the release.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # v1.2.3 -> 1.2.3. A version with a prerelease suffix marks the release as a prerelease. A dry run
      # has no tag, so it passes no version and the build keeps the declared one.
      - name: Read the version out of the tag
        id: version
        shell: pwsh
        run: |
          $version = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $version = $env:GITHUB_REF_NAME -replace '^v', ''
              if ($version -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$') {
                  throw "Tag '$env:GITHUB_REF_NAME' is not a version this workflow can build."
              }
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          $prerelease = if ($version -like '*-*') { 'true' } else { 'false' }
          "prerelease=$prerelease" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $(if ($version) { $version } else { 'as declared (dry run)' })"

      - name: Restore
        run: dotnet restore --locked-mode

      # -p:Version overrides what Directory.Build.props declares, so the tag decides and no file
      # has to be edited to cut a release.
      - name: Build
        shell: pwsh
        run: |
          $versionArgs = @(if ('${{ steps.version.outputs.version }}') { '-p:Version=${{ steps.version.outputs.version }}' })
          dotnet build --no-restore -c Release @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The build carries the version the tag asked for
        shell: pwsh
        run: |
          $expected = @(if ('${{ steps.version.outputs.version }}') { '-Expected', '${{ steps.version.outputs.version }}' })
          powershell -ExecutionPolicy Bypass -File tools/Test-VersionSingleSource.ps1 @expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same gate as every push, against the bits being shipped.
      - name: Test
        run: dotnet test --no-build -c Release

      - name: Package
        shell: pwsh
        run: |
          $versionArgs = @(if ('${{ steps.version.outputs.version }}') { '-Version', '${{ steps.version.outputs.version }}' })
          powershell -ExecutionPolicy Bypass -File tools/New-ReleasePackage.ps1 -NoBuild @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content artifacts/SHA256SUMS

      # gh is preinstalled on the runner, so the release needs no third-party action.
      - name: Create the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', $env:GITHUB_REF_NAME)
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME $flags (Resolve-Path 'artifacts/*.zip') (Resolve-Path 'artifacts/SHA256SUMS')

      - name: Keep the artifacts on the run as well
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbang-release
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
